name: Verify desktop migration
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build and test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb
      - run: npm ci --include=dev
      - run: npm test
      - run: npm run test:rust
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - name: Build real test application
        run: npm run tauri -- build --debug --no-bundle --features e2e
      # Hosted windows-latest cannot hand msedgedriver an interactive WebView2
      # desktop session, so the WebDriver suite there fails with
      # "DevToolsActivePort file doesn't exist" before any app assertion runs.
      # This smoke test therefore checks directly that the packaged app starts
      # and stays alive, and the WebDriver suite below is advisory on Windows.
      - name: Windows startup smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "src-tauri/target/debug/zinsrechner.exe"
          if (-not (Test-Path $exe)) { throw "Build output missing: $exe" }
          $dir = ".jait/artifacts/native/windows-startup"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $proc = Start-Process -FilePath (Resolve-Path $exe).Path -PassThru `
            -RedirectStandardOutput "$dir/stdout.log" -RedirectStandardError "$dir/stderr.log"
          Start-Sleep -Seconds 15
          if ($proc.HasExited) {
            Write-Host "Application exited during startup with code $($proc.ExitCode)"
            Get-Content "$dir/stdout.log", "$dir/stderr.log" -ErrorAction SilentlyContinue
            throw "Zinsrechner exited during startup on Windows"
          }
          Write-Host "Application stayed alive for 15s after launch."
          Stop-Process -Id $proc.Id -Force
        timeout-minutes: 5
      - name: Install Tauri test driver
        run: cargo install tauri-driver --locked
      - name: Install matching Edge driver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $edge = (Get-Item "${env:ProgramFiles(x86)}/Microsoft/Edge/Application/msedge.exe").VersionInfo.ProductVersion
          New-Item -ItemType Directory -Force .jait/artifacts/tools | Out-Null
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$edge/edgedriver_win64.zip" -OutFile .jait/artifacts/tools/edge.zip -ConnectionTimeoutSeconds 15 -OperationTimeoutSeconds 90
          Expand-Archive .jait/artifacts/tools/edge.zip .jait/artifacts/tools -Force
          "NATIVE_WEBDRIVER=$((Resolve-Path .jait/artifacts/tools/msedgedriver.exe).Path)" >> $env:GITHUB_ENV
      - name: Native desktop tests (Linux)
        if: runner.os == 'Linux'
        env:
          TAURI_DRIVER: tauri-driver
          NATIVE_WEBDRIVER: /usr/bin/WebKitWebDriver
        run: xvfb-run -a npm run test:native
      - name: Native desktop tests (Windows, advisory)
        # Blocking gate for the native suite is the Linux job, which drives the same
        # Tauri binary and the same Rust commands under WebKitWebDriver. On hosted
        # windows-latest the msedgedriver session cannot be created, so this run is
        # recorded and uploaded but does not gate releases. Windows-native sign-off
        # (installed upgrade, MSIX path, signed update) must happen on a real desktop.
        if: runner.os == 'Windows'
        continue-on-error: true
        env:
          TAURI_DRIVER: tauri-driver
        run: npm run test:native
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-tests-${{ matrix.os }}
          path: |
            .jait/artifacts/playwright-report
            .jait/artifacts/playwright-results
            .jait/artifacts/native
            .jait/shots
