name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_to_store:
        description: "AppX nach dem Build an den Microsoft Store uebermitteln (benoetigt Secrets + Freigabe)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check if release exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if gh release view "v$VERSION" &>/dev/null; then
            echo "Release v$VERSION already exists"
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "Release v$VERSION does not exist, will create"
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  build-windows:
    needs: [check-version, verify]
    if: needs.check-version.outputs.should_release == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_to_store == true)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Test
        run: npm test

      - name: Build Microsoft Store package
        run: npm run build:store

      - name: Build compact Windows installer
        shell: pwsh
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:TAURI_UPDATER_PUBLIC_KEY -and $env:TAURI_SIGNING_PRIVATE_KEY) {
            node scripts/updater-config.mjs
            if ($LASTEXITCODE -ne 0) { throw "Updater configuration failed." }
            npm run tauri -- build --config .jait/artifacts/tauri-updater.conf.json
          } else {
            npm run build
          }
          if ($LASTEXITCODE -ne 0) { throw "Tauri build failed." }
          node scripts/stage-release.mjs
          if ($LASTEXITCODE -ne 0) { throw "Release staging failed." }

      - name: Create GitHub release
        if: needs.check-version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          $assets = @(Get-ChildItem "release/$env:VERSION" -File | ForEach-Object { $_.FullName })
          gh release create "v$env:VERSION" @assets `
            --title "Zinsrechner $env:VERSION" `
            --notes "Zinsrechner $env:VERSION (Tauri): compact Windows installer and Microsoft Store AppX. Existing account data is copied on first launch. Forecast tables now expand to full height and stay scrollable at small window sizes."

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: release/*/Zinsrechner-Store-*-x64.appx

  # Optionale Store-Einreichung. Laeuft nur bei manuellem Start mit
  # publish_to_store=true und wartet auf die Freigabe des Environments
  # "microsoft-store" (Settings -> Environments -> Required reviewers).
  store-publish:
    needs: [check-version, build-windows]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_store == true
    runs-on: windows-latest
    environment: microsoft-store
    steps:
      - uses: actions/checkout@v4

      - name: Download AppX package
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: store-package

      - name: Setup Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Configure Microsoft Store Developer CLI
        shell: pwsh
        env:
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          foreach ($name in 'PARTNER_CENTER_TENANT_ID','PARTNER_CENTER_SELLER_ID','PARTNER_CENTER_CLIENT_ID','PARTNER_CENTER_CLIENT_SECRET') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "GitHub secret $name is not set. See docs/microsoft-store.md."
            }
          }

          msstore reconfigure `
            --tenantId $env:PARTNER_CENTER_TENANT_ID `
            --sellerId $env:PARTNER_CENTER_SELLER_ID `
            --clientId $env:PARTNER_CENTER_CLIENT_ID `
            --clientSecret $env:PARTNER_CENTER_CLIENT_SECRET

      - name: Wait for existing Store submission to finish
        shell: pwsh
        env:
          MSSTORE_APP_ID: ${{ vars.MSSTORE_APP_ID }}
        run: |
          $deadline = (Get-Date).AddHours(2)
          do {
            $applicationJson = & msstore apps get $env:MSSTORE_APP_ID
            if ($LASTEXITCODE -ne 0) { throw "Could not retrieve Store application state." }
            $application = ($applicationJson | Out-String) | ConvertFrom-Json
            if (!$application.pendingApplicationSubmission.id) {
              Write-Host "No pending Store submission; ready to publish."
              break
            }
            $submissionJson = & msstore submission get $env:MSSTORE_APP_ID
            if ($LASTEXITCODE -ne 0) { throw "Could not retrieve pending submission state." }
            $submission = ($submissionJson | Out-String) | ConvertFrom-Json
            Write-Host "Existing submission $($submission.id): $($submission.status)"
            if ($submission.status -in @("Pending", "CommitFailed", "PreProcessingFailed", "CertificationFailed", "ReleaseFailed")) {
              Write-Host "Existing submission is editable; ready to replace it."
              break
            }
            if ((Get-Date) -ge $deadline) { throw "Existing Store submission remained locked for two hours." }
            Start-Sleep -Seconds 60
          } while ($true)

      - name: Publish package to Microsoft Store
        shell: pwsh
        env:
          MSSTORE_APP_ID: ${{ vars.MSSTORE_APP_ID }}
          PACKAGE_VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSSTORE_APP_ID)) {
            throw "Repository variable MSSTORE_APP_ID is not set. See docs/microsoft-store.md."
          }

          $packageDirectory = Join-Path "store-package" $env:PACKAGE_VERSION
          $packageName = "Zinsrechner-Store-$env:PACKAGE_VERSION-x64.appx"
          $packagePath = Join-Path $packageDirectory $packageName
          if (!(Test-Path -LiteralPath $packagePath -PathType Leaf)) {
            throw "Expected Store package is missing: $packagePath"
          }
          $packages = @(Get-ChildItem -LiteralPath $packageDirectory -Filter *.appx -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one AppX in $packageDirectory; found $($packages.Count)."
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $packagePath).Path)
          try {
            $entry = $archive.GetEntry("AppxManifest.xml")
            if ($null -eq $entry) { throw "AppX manifest is missing." }
            $reader = [System.IO.StreamReader]::new($entry.Open())
            try { [xml]$manifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
            $expectedVersion = "$env:PACKAGE_VERSION.0"
            if ($manifest.Package.Identity.Version -ne $expectedVersion) {
              throw "Expected manifest version $expectedVersion; found $($manifest.Package.Identity.Version)."
            }
          } finally {
            $archive.Dispose()
          }
          Write-Host "Publishing verified package: $packagePath (manifest $expectedVersion)"
          Get-FileHash -LiteralPath $packagePath -Algorithm SHA256

          $publishOutput = & msstore publish . `
            --inputDirectory $packageDirectory `
            --appId $env:MSSTORE_APP_ID 2>&1 | Tee-Object -Variable publishLog
          $publishExitCode = $LASTEXITCODE
          $publishOutput | Write-Output
          if ($publishExitCode -ne 0) { throw "Store publish failed with exit code $publishExitCode." }
          if (($publishLog | Out-String) -notmatch [regex]::Escape($packageName)) {
            throw "Store response did not confirm the expected package $packageName. Inspect the submission before retrying."
          }
