name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_to_store:
        description: "AppX nach dem Build an den Microsoft Store uebermitteln (benoetigt Secrets + Freigabe)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check if release exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if gh release view "v$VERSION" &>/dev/null; then
            echo "Release v$VERSION already exists"
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "Release v$VERSION does not exist, will create"
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  build-windows:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Build Microsoft Store package
        run: npm run build:store

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          gh release create "v$env:VERSION" `
            "release/$env:VERSION/Zinsrechner-Store-$env:VERSION-x64.appx" `
            --title "Zinsrechner $env:VERSION" `
            --notes "Microsoft Store AppX package for Zinsrechner $env:VERSION. Upload this package in Partner Center; Microsoft signs Store packages during certification."

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: release/*/Zinsrechner-Store-*-x64.appx

  # Optionale Store-Einreichung. Laeuft nur bei manuellem Start mit
  # publish_to_store=true und wartet auf die Freigabe des Environments
  # "microsoft-store" (Settings -> Environments -> Required reviewers).
  store-publish:
    needs: [check-version, build-windows]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_store == true
    runs-on: windows-latest
    environment: microsoft-store
    steps:
      - uses: actions/checkout@v4

      - name: Download AppX package
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: store-package

      - name: Setup Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Configure Microsoft Store Developer CLI
        shell: pwsh
        env:
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          foreach ($name in 'PARTNER_CENTER_TENANT_ID','PARTNER_CENTER_SELLER_ID','PARTNER_CENTER_CLIENT_ID','PARTNER_CENTER_CLIENT_SECRET') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "GitHub secret $name is not set. See docs/microsoft-store.md."
            }
          }

          msstore reconfigure `
            --tenantId $env:PARTNER_CENTER_TENANT_ID `
            --sellerId $env:PARTNER_CENTER_SELLER_ID `
            --clientId $env:PARTNER_CENTER_CLIENT_ID `
            --clientSecret $env:PARTNER_CENTER_CLIENT_SECRET

      - name: Publish package to Microsoft Store
        shell: pwsh
        env:
          MSSTORE_APP_ID: ${{ vars.MSSTORE_APP_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSSTORE_APP_ID)) {
            throw "Repository variable MSSTORE_APP_ID is not set. See docs/microsoft-store.md."
          }

          msstore publish . `
            --inputDirectory store-package `
            --appId $env:MSSTORE_APP_ID
