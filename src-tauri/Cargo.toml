[package]
name = "zinsrechner"
version = "2.0.1"
description = "WiDev Zinsrechner"
authors = ["Jakob Winkler"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "zinsrechner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
sys-locale = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[features]
# Test-only dialog destinations and isolated data roots. Never enabled in release CI.
e2e = []

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
